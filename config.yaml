rules:
  # pick_card：升级时 OCR 读三张卡标题，按 priority 从上往下选第一张有的卡，全自动。
  # priority 引用文件顶部的 card_priority 完整名单，改顺序即改优先级。
  # 匹配仍支持 * 通配（电磁* / *力场*），名单没列全时可临时补。
  # 三张都没命中名单时点 fallback 位置。
  # 想改成“暂停让我自己选”：把 action 改成 manual，并删掉 slots/title_boxes/priority。
  - name: 升级选卡
    template: templates/levelup_banner.png
    action: pick_card
    threshold: 0.85
    cooldown: 1.5
    slots:                # 三张卡的点击位置（窗口比例）
      - [0.178, 0.570]
      - [0.500, 0.570]
      - [0.822, 0.570]
    title_boxes:          # 三张卡标题栏的位置 [x0, y0, x1, y1]
      - [0.035, 0.458, 0.322, 0.497]
      - [0.358, 0.458, 0.640, 0.497]
      - [0.678, 0.458, 0.966, 0.497]
    priority: *card_priority
    fallback: middle

  # 抽完卡后会翻出「获得」按钮，横幅还留着，所以确认规则必须写在盲抽规则前面。
  # 默认禁用：这一步会触发「获得额外机会」（通常是激励视频广告），自动点等于机器刷广告曝光。
  # 需要时把 enabled 改成 true 即可恢复。
  - name: 额外机会-获得
    enabled: false
    template: templates/acquire_btn.png
    action: click
    threshold: 0.88
    cooldown: 2

  # 精英怪 / BOSS 击败后的「额外机会」：点未翻开的卡背再抽，可以连点多张。
  # 每抽一张剩下的卡会重排，所以不写死点位：按 templates/card_back.png 动态找卡背，
  # 点完重新截图再找，直到界面关闭或没有卡背（带紫色图标的卡也算卡背）。
  - name: 额外机会-多抽
    template: templates/extra_chance_banner.png
    action: draw_cards
    card_template: templates/card_back.png
    threshold: 0.85          # 额外机会横幅的匹配度
    card_threshold: 0.62     # 卡背的匹配度
    max_picks: 5             # 最多连抽几张
    pick_delay: 1.0          # 每张点完等多久再识别
    cooldown: 2

  # 精英关卡开局的「选择卡牌」界面：横幅不同，卡牌位置和普通升级一样。
  - name: 精英BOSS选卡
    template: templates/select_banner.png
    action: pick_card
    threshold: 0.85
    cooldown: 1.5
    slots:
      - [0.178, 0.570]
      - [0.500, 0.570]
      - [0.822, 0.570]
    title_boxes:
      - [0.035, 0.458, 0.322, 0.497]
      - [0.358, 0.458, 0.640, 0.497]
      - [0.678, 0.458, 0.966, 0.497]
    priority: *card_priority
    fallback: middle

  - name: 新阶段-跳过
    template: templates/newstage_banner.png
    action: click
    point: [0.50, 0.94]   # 底部“点击此处跳过”
    threshold: 0.85
    cooldown: 1.5

  - name: 结算-再来一次
    template: templates/again_btn.png
    action: click
    cooldown: 3
    threshold: 0.85
    stage_end: true

  # 胜利结算「挑战完成」页：点左下「返回」回主界面，再由开始战斗规则开下一把。
  # 右下「双倍奖励」要广告，不点；底部月卡推广条也不点。
  - name: 结算-返回
    template: templates/settle_back.png
    action: click
    threshold: 0.88
    cooldown: 3
    stage_end: true

  - name: 主界面-开始战斗
    template: templates/start_battle.png
    action: click
    cooldown: 5
    threshold: 0.95   # 结算界面上会误匹配到 0.91，所以收紧

# 结算/复活/再来一次等界面还没截到，规则等有截图后再补。

# 没有模板时也能用固定坐标循环：把 mode 改成 sequence，并填写 steps。
# 注意：顺序模式不看画面，切到别的页面会瞎点，建议配合 foreground 检查使用。
# steps:
#   - click: [0.50, 0.88]   # 屏幕比例坐标
#   - wait: 2.0
#   - key: space
#   - wait: 3.0
