# 小游戏挂机配置（示例：塔防小游戏）
# 窗口标题用 `python -m gamebot.tools windows` 查，支持正则
# 小游戏窗口标题常见为「小游戏」；开在浏览器里时改成对应标题（如 microgame）
window: "小游戏"

mode: rules

# true = 后台模式：点击用窗口消息发送，不移动、不占用鼠标，可以同时用电脑。
# 注意：窗口不能最小化；尽量别被别的窗口完全挡住，完全遮挡时游戏画面可能停住。
background: true

# 挂机模式：启动网页上切换。每个模式在下面 rules 的基础上增删规则，
# 选卡优先级（card_groups / card_priority）所有模式共用。
# add_rules 里的规则只在选中该模式时启用；remove_rules 按规则名移除公共规则。
modes:
  - id: campaign
    name: 战役模式
    desc: 原玩法，主界面点「开始战斗」；后台运行，不占鼠标。
    background: true
  - id: global
    name: 全球联防
    desc: 主界面点「全球联防 · 进入」，再点「开始挑战」；后台运行，不占鼠标，窗口别最小化或被完全挡住。
    remove_rules: [主界面-开始战斗]
    add_rules:
      # 「全球联防」标题 + 右侧「进入」：进入点按标题模板的倍数偏移，列表滚动也能点准。
      - name: 全球联防-进入
        template: templates/global_enter.png
        action: click
        point_rel: [2.41, 4.63]
        threshold: 0.95
        cooldown: 5
      # 联合防御大厅底部的「开始挑战」，点一次开始一局。
      - name: 全球联防-开始挑战
        template: templates/global_start.png
        action: click
        threshold: 0.95
        cooldown: 5
      # 挑战失败/结算界面的「返回」，回到大厅后由上面的规则接着开下一局。
      - name: 全球联防-失败返回
        template: templates/global_back.png
        action: click
        threshold: 0.92
        cooldown: 4
        stage_end: true

defaults:
  interval: 0.6      # 没命中任何规则时，隔多久再看一帧
  click_delay: 0.5   # 点击后隔多久再识别，避免连点
  threshold: 0.85    # 模板相似度阈值，0~1
  jitter_px: 2       # 点击位置随机偏移像素，避免每次点同一个点
  # 模板参考宽度：crop 会自动在模板旁写同名 .json，运行时按
  # 「当前窗口宽度 ÷ 参考宽度」缩放模板；没有 .json 的模板用这个值兜底。
  ui_width: 545

max_runtime_min: 240  # 到点自动停，防止挂一整天

# 一关打完（出现结算界面）之后怎么办，启动网页上也能选：
#   continue = 继续下一关（默认，自动点结算按钮开下一把）
#   stop     = 停在结算页，挂机自动退出
#   pause    = 停在结算页等你，按 F8 继续下一关
# 规则里标了 stage_end: true 的界面（结算页）算作一关结束。
stage_end: continue

# 每次启动保留最近多少份运行日志，更早的自动删除（填 0 表示不清理）。
log_keep: 20

